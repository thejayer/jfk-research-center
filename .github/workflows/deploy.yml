name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    needs: [typecheck, axe]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: jfk-vault

      # --source=. submits a *regional* Cloud Build in us-central1, which
      # can sit QUEUED until queueTtl expires and never start. Global
      # Cloud Build (no --region) starts immediately; then deploy --image.
      # --gcs-log-dir writes logs to the project Cloud Build bucket the SA
      # already uses for source uploads. Streaming the *default* logs
      # bucket requires project Viewer and fails the job after SUCCESS.
      - name: Build image (global Cloud Build)
        run: |
          IMAGE="us-central1-docker.pkg.dev/jfk-vault/cloud-run-source-deploy/jfk-research-center:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit \
            --tag="${IMAGE}" \
            --gcs-log-dir=gs://jfk-vault_cloudbuild/logs \
            --project=jfk-vault \
            .

      - name: Deploy to Cloud Run
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          REDACTION_REVIEW_BUCKET: ${{ secrets.REDACTION_REVIEW_BUCKET }}
        # Every deploy re-asserts the full expected env. Add new vars here
        # plus a repo secret so a fresh rollout is self-contained.
        run: |
          gcloud run deploy jfk-research-center \
            --image="${IMAGE}" \
            --region=us-central1 \
            --project=jfk-vault \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi --cpu=1 \
            --max-instances=3 --min-instances=0 \
            --set-env-vars="^|^JFK_BQ_PROJECT=jfk-vault|JFK_API_DISABLE_SEMANTIC_SEARCH=1|JFK_BQ_MAX_BYTES_BILLED=268435456|JFK_TRUSTED_PROXY_HOPS=1|JFK_SEARCH_CACHE_TTL_SECONDS=300|JFK_SEARCH_CACHE_MAX_ENTRIES=500|ADMIN_TOKEN=${ADMIN_TOKEN}|ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}|REDACTION_REVIEW_BUCKET=${REDACTION_REVIEW_BUCKET}|JFK_API_BASE_URL=https://researchjfk.ai" \
            --quiet

  axe:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: Run accessibility and responsive regression gate
        run: npm run audit:a11y
      - name: Upload accessibility regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-regression-report
          path: |
            axe-report.json
            axe-artifacts/
          if-no-files-found: warn
