name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  # PR CI for branch protection. Do not add pull_request_target.
  # Required checks to enable after this lands: typecheck, axe.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. upload-artifact@v4 uses ACTIONS_RUNTIME_TOKEN,
# not GITHUB_TOKEN, so actions: write is not required for the axe report.
# id-token: write is granted only on the deploy job (WIF / OIDC).
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    # Never run on pull_request (including forks). Secrets stay off PR CI.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [typecheck, axe]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # WIF through jfk-deployer. These GCP resources must exist before merge
      # (created in jfk-vault in parallel). Do not invent alternate names.
      # Do not delete USER_MANAGED keys until a green WIF deploy.
      #   pool/provider: projects/690906762945/locations/global/workloadIdentityPools/github/providers/thejayer-jfk-research-center
      #   SA: jfk-deployer@jfk-vault.iam.gserviceaccount.com
      #   secrets (latest): jfk-api-keys, jfk-admin-token, jfk-admin-session-secret
      #   runtime SA (secretAccessor): 690906762945-compute@developer.gserviceaccount.com
      - uses: google-github-actions/auth@v3
        with:
          project_id: jfk-vault
          workload_identity_provider: projects/690906762945/locations/global/workloadIdentityPools/github/providers/thejayer-jfk-research-center
          service_account: jfk-deployer@jfk-vault.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: jfk-vault

      # --source=. submits a *regional* Cloud Build in us-central1, which
      # can sit QUEUED until queueTtl expires and never start. Global
      # Cloud Build (no --region) starts immediately; then deploy --image.
      # --gcs-log-dir writes logs to the project Cloud Build bucket the SA
      # already uses for source uploads. Streaming the *default* logs
      # bucket requires project Viewer and fails the job after SUCCESS.
      - name: Build image (global Cloud Build)
        run: |
          IMAGE="us-central1-docker.pkg.dev/jfk-vault/cloud-run-source-deploy/jfk-research-center:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit \
            --tag="${IMAGE}" \
            --gcs-log-dir=gs://jfk-vault_cloudbuild/logs \
            --project=jfk-vault \
            .

      - name: Deploy to Cloud Run
        env:
          REDACTION_REVIEW_BUCKET: ${{ secrets.REDACTION_REVIEW_BUCKET }}
        # Non-secret env via --set-env-vars. Credentials come from Secret
        # Manager — do not interpolate JFK_API_KEYS / ADMIN_TOKEN /
        # ADMIN_SESSION_SECRET into the runner or the gcloud argv.
        # CPU / memory / instance flags are unchanged.
        run: |
          gcloud run deploy jfk-research-center \
            --image="${IMAGE}" \
            --region=us-central1 \
            --project=jfk-vault \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi --cpu=1 \
            --max-instances=3 --min-instances=0 \
            --set-env-vars="^|^JFK_BQ_PROJECT=jfk-vault|JFK_API_DISABLE_SEMANTIC_SEARCH=1|JFK_BQ_MAX_BYTES_BILLED=268435456|JFK_TRUSTED_PROXY_HOPS=1|JFK_SEARCH_CACHE_TTL_SECONDS=300|JFK_SEARCH_CACHE_MAX_ENTRIES=500|REDACTION_REVIEW_BUCKET=${REDACTION_REVIEW_BUCKET}|JFK_API_BASE_URL=https://researchjfk.ai" \
            --set-secrets="^|^JFK_API_KEYS=jfk-api-keys:latest|ADMIN_TOKEN=jfk-admin-token:latest|ADMIN_SESSION_SECRET=jfk-admin-session-secret:latest" \
            --quiet

  axe:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: Run accessibility and responsive regression gate
        run: npm run audit:a11y
      - name: Upload accessibility regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-regression-report
          path: |
            axe-report.json
            axe-artifacts/
          if-no-files-found: warn
